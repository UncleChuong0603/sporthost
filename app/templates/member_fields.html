{% macro gender_field(selected='unspecified', locked=false) -%}
<label>Giới tính<select name="gender"{% if locked %} disabled{% endif %}>{% for value, label in gender_labels.items() %}<option value="{{ value }}"{% if value == selected %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
{% if locked %}<input type="hidden" name="gender" value="{{ selected }}">{% endif %}
{%- endmacro %}
