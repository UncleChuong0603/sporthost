{% macro club_settings_fields(club=none) -%}
<div class="settings-field"><label for="club-sport-type">Môn thể thao</label><select id="club-sport-type" name="sport_type" required>{% for code, sport in sports.items() %}<option value="{{ code }}"{% if code==(club.sport_type if club else 'badminton') %} selected{% endif %}>{{ sport.label }}</option>{% endfor %}</select></div>
<label>Trình độ phù hợp<textarea name="skill_guidance" rows="2" maxlength="500" placeholder="Ví dụ: Người mới và trình độ trung bình; ưu tiên giao lưu">{{ club.skill_guidance if club else '' }}</textarea><span class="form-note">Dùng cách gọi trình độ quen thuộc với CLB của bạn.</span></label>
<div class="two">
  <label>Giới hạn người mặc định<input name="default_capacity" type="number" inputmode="numeric" min="1" max="200" value="{{ club.default_capacity if club else 20 }}" required><span class="form-note">Có thể chọn lại khi tạo từng buổi.</span></label>
  <div class="settings-field"><label for="club-approval-mode">Cách duyệt đăng ký mặc định</label><select id="club-approval-mode" name="default_approval_mode" required>{% for code, label in approval_modes.items() %}<option value="{{ code }}"{% if code==(club.default_approval_mode if club else 'MANUAL_APPROVE') %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
</div>
<div class="settings-field"><label for="club-fee-mode">Cách thu phí mặc định</label><select id="club-fee-mode" name="default_fee_mode" required>{% for code, label in fee_modes.items() %}<option value="{{ code }}"{% if code==(club.default_fee_mode if club else 'FIXED_PRICE') %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<label>Chính sách hủy<textarea name="cancellation_policy" rows="3" maxlength="2000" placeholder="Hạn báo hủy, cách xử lý hủy sát giờ và khoản đã chuyển">{{ club.cancellation_policy if club else '' }}</textarea></label>
<label>Hướng dẫn đến sân<textarea name="venue_instructions" rows="3" maxlength="2000" placeholder="Địa chỉ, lối vào, chỗ gửi xe hoặc cách nhận diện nhóm">{{ club.venue_instructions if club else '' }}</textarea></label>
{%- endmacro %}
